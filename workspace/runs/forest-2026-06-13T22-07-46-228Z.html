<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinite Forest</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
        #info {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            background: rgba(0,0,0,0.5);
            padding: 10px 20px;
            border-radius: 8px;
            pointer-events: none;
            z-index: 10;
            text-align: center;
        }
        #info.hidden { display: none; }
    </style>
</head>
<body>
    <div id="info">Click to enter the forest. WASD to walk, mouse to look around.</div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- Setup Scene, Camera, Renderer ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // Sky blue

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.7, 0); // Eye height

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // --- Lighting ---
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);
        const fillLight = new THREE.DirectionalLight(0xffffff, 0.3);
        fillLight.position.set(-10, 10, -10);
        scene.add(fillLight);

        // --- Ground ---
        const groundGeo = new THREE.PlaneGeometry(200, 200);
        const groundMat = new THREE.MeshLambertMaterial({ color: 0x3a7d3a });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.1;
        scene.add(ground);

        // --- Tree Generation ---
        const trees = [];
        const treeGroup = new THREE.Group();
        scene.add(treeGroup);

        // Tree template: trunk + foliage
        function createTree(x, z) {
            const group = new THREE.Group();
            
            // Trunk
            const trunkHeight = 1.5 + Math.random() * 1.5;
            const trunkGeo = new THREE.CylinderGeometry(0.15, 0.25, trunkHeight, 6);
            const trunkMat = new THREE.MeshLambertMaterial({ color: 0x5c3a1e });
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.y = trunkHeight / 2;
            group.add(trunk);

            // Foliage (3 layers)
            const foliageColor = new THREE.Color().setHSL(0.3, 0.7, 0.2 + Math.random() * 0.2);
            const foliageMat = new THREE.MeshLambertMaterial({ color: foliageColor });
            
            const layers = [
                { y: trunkHeight + 0.2, radius: 0.8, height: 0.6 },
                { y: trunkHeight + 0.7, radius: 0.6, height: 0.5 },
                { y: trunkHeight + 1.1, radius: 0.4, height: 0.4 }
            ];
            
            for (const layer of layers) {
                const geo = new THREE.SphereGeometry(layer.radius, 6, 6);
                const mesh = new THREE.Mesh(geo, foliageMat);
                mesh.position.y = layer.y;
                mesh.scale.y = layer.height / layer.radius;
                group.add(mesh);
            }

            group.position.set(x, 0, z);
            // Random rotation
            group.rotation.y = Math.random() * Math.PI * 2;
            // Random scale variation
            const scale = 0.8 + Math.random() * 0.6;
            group.scale.set(scale, scale, scale);

            return group;
        }

        // Spawn trees in a radius around a position
        const SPAWN_RADIUS = 30;
        const DESPAWN_RADIUS = 40;
        const TREE_DENSITY = 0.08; // trees per unit area

        function spawnTreesAround(posX, posZ) {
            const count = Math.floor(SPAWN_RADIUS * SPAWN_RADIUS * Math.PI * TREE_DENSITY);
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const radius = Math.sqrt(Math.random()) * SPAWN_RADIUS;
                const x = posX + Math.cos(angle) * radius;
                const z = posZ + Math.sin(angle) * radius;
                
                // Avoid placing trees too close to player start
                if (Math.abs(x) < 2 && Math.abs(z) < 2) continue;
                
                // Check if tree already exists nearby (simple grid check)
                let tooClose = false;
                for (const t of trees) {
                    const dx = t.position.x - x;
                    const dz = t.position.z - z;
                    if (dx*dx + dz*dz < 1.5) {
                        tooClose = true;
                        break;
                    }
                }
                if (tooClose) continue;

                const tree = createTree(x, z);
                treeGroup.add(tree);
                trees.push(tree);
            }
        }

        // Remove trees too far from player
        function despawnFarTrees(posX, posZ) {
            const toRemove = [];
            for (let i = trees.length - 1; i >= 0; i--) {
                const t = trees[i];
                const dx = t.position.x - posX;
                const dz = t.position.z - posZ;
                if (dx*dx + dz*dz > DESPAWN_RADIUS * DESPAWN_RADIUS) {
                    treeGroup.remove(t);
                    toRemove.push(i);
                }
            }
            for (const idx of toRemove) {
                trees.splice(idx, 1);
            }
        }

        // Initial spawn
        spawnTreesAround(0, 0);

        // --- Player Controls ---
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let isLocked = false;

        const info = document.getElementById('info');

        document.addEventListener('click', () => {
            if (!isLocked) {
                renderer.domElement.requestPointerLock();
            }
        });

        document.addEventListener('pointerlockchange', () => {
            isLocked = document.pointerLockElement === renderer.domElement;
            info.classList.toggle('hidden', isLocked);
        });

        document.addEventListener('keydown', (e) => {
            switch(e.code) {
                case 'KeyW': moveForward = true; break;
                case 'KeyS': moveBackward = true; break;
                case 'KeyA': moveLeft = true; break;
                case 'KeyD': moveRight = true; break;
            }
        });

        document.addEventListener('keyup', (e) => {
            switch(e.code) {
                case 'KeyW': moveForward = false; break;
                case 'KeyS': moveBackward = false; break;
                case 'KeyA': moveLeft = false; break;
                case 'KeyD': moveRight = false; break;
            }
        });

        // Mouse look
        document.addEventListener('mousemove', (e) => {
            if (!isLocked) return;
            camera.rotation.y -= e.movementX * 0.002;
            camera.rotation.x -= e.movementY * 0.002;
            camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotation.x));
        });

        // --- Game Loop ---
        const clock = new THREE.Clock();

        function animate() {
            const delta = clock.getDelta();
            const speed = 5.0;

            // Movement
            direction.set(0, 0, 0);
            if (moveForward) direction.z -= 1;
            if (moveBackward) direction.z += 1;
            if (moveLeft) direction.x -= 1;
            if (moveRight) direction.x += 1;
            direction.normalize();

            // Rotate direction by camera yaw
            const forward = new THREE.Vector3(0, 0, -1);
            forward.applyQuaternion(camera.quaternion);
            forward.y = 0;
            forward.normalize();

            const right = new THREE.Vector3(1, 0, 0);
            right.applyQuaternion(camera.quaternion);
            right.y = 0;
            right.normalize();

            const moveVec = new THREE.Vector3();
            if (moveForward) moveVec.add(forward);
            if (moveBackward) moveVec.sub(forward);
            if (moveRight) moveVec.add(right);
            if (moveLeft) moveVec.sub(right);
            moveVec.normalize();

            camera.position.x += moveVec.x * speed * delta;
            camera.position.z += moveVec.z * speed * delta;

            // Update trees around player
            const px = camera.position.x;
            const pz = camera.position.z;
            despawnFarTrees(px, pz);
            spawnTreesAround(px, pz);

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        animate();

        // --- Resize ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
