<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background: #1a1a2e; font-family: Arial, sans-serif; }
  .game-container { text-align: center; }
  canvas { border: 2px solid #e94560; background: #16213e; }
  .score { color: #e94560; font-size: 24px; margin: 10px; }
  .game-over { color: #e94560; font-size: 32px; display: none; }
  .restart-btn { background: #e94560; color: white; border: none; padding: 10px 20px; font-size: 18px; cursor: pointer; margin: 10px; border-radius: 5px; }
  .restart-btn:hover { background: #c73652; }
</style>
</head>
<body>
<div class="game-container">
  <div class="score">Score: <span id="score">0</span></div>
  <canvas id="gameCanvas" width="400" height="400"></canvas>
  <div class="game-over" id="gameOver">Game Over!</div>
  <button class="restart-btn" id="restartBtn" style="display:none">Restart</button>
</div>
<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const scoreElement = document.getElementById('score');
  const gameOverElement = document.getElementById('gameOver');
  const restartBtn = document.getElementById('restartBtn');

  const gridSize = 20;
  const tileCount = canvas.width / gridSize;

  let snake = [{x: 10, y: 10}];
  let direction = {x:1, y:0};
  let food = {x: 15, y: 15};
  let score = 0;
  let gameRunning = true;

  function generateFood() {
    food = {
      x: Math.floor(Math.random() * tileCount),
      y: Math.floor(Math.random() * tileCount)
    };
    // Make sure food doesn't spawn on snake
    for (let segment of snake) {
      if (segment.x === food.x && segment.y === food.y) {
        generateFood();
        break;
      }
    }
  }

  function gameLoop() {
    if (!gameRunning) return;
    
    // Move snake
    const head = {x: snake[0].x + direction.x, y: snake[0].y + direction.y};
    
    // Wall collision
    if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
      gameOver();
      return;
    }
    
    // Self collision
    for (let segment of snake) {
      if (head.x === segment.x && head.y === segment.y) {
        gameOver();
        return;
      }
    }
    
    snake.unshift(head);
    
    // Check food
    if (head.x === food.x && head.y === food.y) {
      score++;
      scoreElement.textContent = score;
      generateFood();
    } else {
      snake.pop();
    }
    
    draw();
    setTimeout(gameLoop, 100);
  }

  function draw() {
    // Clear canvas
    ctx.fillStyle = '#16213e';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // Draw snake
    ctx.fillStyle = '#e94560';
    for (let segment of snake) {
      ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize - 2, gridSize - 2);
    }
    
    // Draw food
    ctx.fillStyle = '#0f3460';
    ctx.beginPath();
    ctx.arc(food.x * gridSize + gridSize/2, food.y * gridSize + gridSize/2, gridSize/2 - 2, 0, Math.PI * 2);
    ctx.fill();
  }

  function gameOver() {
    gameRunning = false;
    gameOverElement.style.display = 'block';
    restartBtn.style.display = 'block';
  }

  function restart() {
    snake = [{x: 10, y: 10}];
    direction = {x:1, y:0};
    score = 0;
    scoreElement.textContent = score;
    gameOverElement.style.display = 'none';
    restartBtn.style.display = 'none';
    gameRunning = true;
    generateFood();
    gameLoop();
  }

  // Keyboard controls
  document.addEventListener('keydown', (e) => {
    if (!gameRunning) return;
    switch(e.key) {
      case 'ArrowUp':
        if (direction.y === 0) direction = {x: 0, y: -1};
        break;
      case 'ArrowDown':
        if (direction.y === 0) direction = {x: 0, y: 1};
        break;
      case 'ArrowLeft':
        if (direction.x === 0) direction = {x: -1, y: 0};
        break;
      case 'ArrowRight':
        if (direction.x === 0) direction = {x: 1, y: 0};
        break;
    }
  });

  restartBtn.addEventListener('click', restart);

  // Start game
  generateFood();
  gameLoop();
</script>
</body>
</html>
