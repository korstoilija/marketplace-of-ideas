<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ideas">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <title>Marketplace of Ideas</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;color-scheme:dark;background:#0b0b0c;color:#f5f5f7}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0b0b0c}main{max-width:680px;margin:auto;padding:max(18px,env(safe-area-inset-top)) 16px max(32px,env(safe-area-inset-bottom))}h1{font-size:28px;margin:8px 0 4px}.sub{color:#999;margin:0 0 20px}.panel,.idea{background:#171719;border:1px solid #2a2a2d;border-radius:16px;padding:14px;margin:12px 0}input,textarea,button{font:inherit}textarea,input[type=text]{width:100%;background:#0f0f10;color:#fff;border:1px solid #343438;border-radius:12px;padding:12px}textarea{min-height:88px;resize:vertical}.row{display:flex;gap:10px;align-items:center}.score{flex:1}.score label{font-size:12px;color:#aaa;display:block;margin:8px 0 4px}input[type=range]{width:100%}button{border:0;border-radius:12px;padding:11px 14px;font-weight:650;background:#f5f5f7;color:#111}.secondary{background:#29292c;color:#ddd}.danger{background:transparent;color:#ff6961;padding:8px}.idea h2{font-size:17px;margin:0 0 8px}.meta{font-size:12px;color:#aaa;display:flex;gap:10px}.rank{font-variant-numeric:tabular-nums;color:#fff}.empty{text-align:center;color:#777;padding:32px 0}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-top:20px}.toolbar select{background:#171719;color:#ddd;border:1px solid #343438;border-radius:10px;padding:8px}.idea p{white-space:pre-wrap;color:#d1d1d6}.topline{display:flex;justify-content:space-between;gap:12px}.pill{font-size:12px;background:#27272a;padding:5px 8px;border-radius:999px;white-space:nowrap}
  </style>
</head>
<body><main>
  <h1>Marketplace of Ideas</h1><p class="sub">Capture hypotheses. Rank by expected value × confidence. Stored locally.</p>
  <section class="panel">
    <input id="title" type="text" placeholder="Idea / hypothesis">
    <textarea id="body" placeholder="Why might this be true or useful?"></textarea>
    <div class="row"><div class="score"><label>Value <span id="vout">5</span>/10</label><input id="value" type="range" min="1" max="10" value="5"></div><div class="score"><label>Confidence <span id="cout">50</span>%</label><input id="confidence" type="range" min="0" max="100" value="50"></div></div>
    <button id="add">Add idea</button>
  </section>
  <div class="toolbar"><strong id="count">0 ideas</strong><select id="sort"><option value="rank">Rank</option><option value="new">Newest</option><option value="confidence">Confidence</option></select></div>
  <section id="list"></section>
</main><script src="./app.js"></script></body></html>
